# ═══════════════════════════════════════════
#  玄姝 Agent — Docker Compose
#  一键启动: docker compose up -d --build
#  查看日志: docker compose logs -f
#  端口映射 8901:8901，容器内持久化卷见下方 volumes
# ═══════════════════════════════════════════
services:
  xuanshu:
    build: .
    image: xuanshu-agent:latest
    container_name: xuanshu-agent
    ports:
      - "8901:8901"
    restart: unless-stopped
    environment:
      - XS_HOST=0.0.0.0
      - XS_PORT=8901
      # 可选：启动默认模型 Key（也可启动后在页面「设置/模型」中填写，会落盘到 .data/keys.json）
      # - XS_API_KEY=***
      # 可选：邮件通知
      # - SMTP_HOST=
      # - SMTP_USER=
      # - SMTP_PASS=
    volumes:
      # 持久化：记忆、模型 Key、工作流 不随容器销毁丢失
      - xuanshu-memdir:/app/.memdir
      - xuanshu-memory:/app/.memory
      - xuanshu-data:/app/.data
      - xuanshu-workflows:/app/workflows
      - xuanshu-workspace:/app/workspace_files
      - xuanshu-skills:/app/.skills

volumes:
  xuanshu-memdir:
  xuanshu-memory:
  xuanshu-data:
  xuanshu-workflows:
  xuanshu-workspace:
  xuanshu-skills:
